[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aic-ref"
version = "0.1.0"
description = "Minimal AIC reference client (experimental, pre-Covenant, under-claim)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Adaptive Intelligence Circle" }]
keywords = ["aic", "reference-client", "experimental"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Repository = "https://github.com/AdaptiveIntelligenceCircle/AIC-Reference-Clients"

[tool.setuptools.packages.find]
where = ["."]
include = ["aic_ref*"]

[tool.pytest.ini_options]
testpaths = ["tests"]